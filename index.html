<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12304F">
<title>Quiz IA · Formation CMA</title>
<style>
  :root {
    --navy: #12304F; --navy-2: #1B4166; --coral: #E94E3D; --teal: #A7D3DA;
    --pale: #EEF5F7; --ink: #1E293B; --muted: #5B6B7A; --ok: #1F8A5B; --ok-bg: #E4F4EC;
    --ko-bg: #FDECEA; --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--navy); color: var(--ink);
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
  header { padding: 20px 20px 16px; color: var(--white); }
  .qname { font-size: 15px; color: var(--teal); margin: 0 0 12px; }
  .progress { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--teal); }
  .progress[hidden] { display: none; }
  .bar { flex: 1; height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--coral); width: 0; transition: width .3s ease; }
  main { flex: 1; background: var(--white); border-radius: 22px 22px 0 0; padding: 26px 20px 32px; }
  h1 { font-size: 27px; line-height: 1.2; color: var(--navy); margin: 0 0 14px; }
  h2.question { font-size: 21px; line-height: 1.35; color: var(--navy); margin: 0 0 22px; }
  p { font-size: 17px; line-height: 1.5; margin: 0 0 14px; }
  .muted { color: var(--muted); font-size: 15px; }
  .answers { display: grid; gap: 10px; }
  .answer {
    display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
    font: inherit; font-size: 17px; line-height: 1.4; color: var(--ink);
    background: var(--pale); border: 2px solid var(--pale); border-radius: 14px;
    padding: 14px 14px; cursor: pointer; min-height: 56px;
  }
  .answer .l {
    flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--navy); color: var(--white);
    font-weight: 700; font-size: 15px; display: grid; place-items: center;
  }
  .answer:focus-visible, .btn:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
  .answer[disabled] { cursor: default; }
  .answer.good { background: var(--ok-bg); border-color: var(--ok); }
  .answer.good .l { background: var(--ok); }
  .answer.bad { background: var(--ko-bg); border-color: var(--coral); }
  .answer.bad .l { background: var(--coral); }
  .answer.dim { opacity: .55; }
  .feedback { margin-top: 18px; padding: 16px; border-radius: 14px; background: var(--pale); }
  .feedback strong { display: block; font-size: 18px; margin-bottom: 6px; }
  .feedback.ok strong { color: var(--ok); }
  .feedback.ko strong { color: var(--coral); }
  .feedback p { font-size: 16px; margin: 0; }
  .btn {
    display: block; width: 100%; margin-top: 20px; padding: 17px; border: 0; border-radius: 14px;
    background: var(--coral); color: var(--white); font: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .btn.secondary { background: var(--pale); color: var(--navy); }
  .score { text-align: center; padding: 10px 0 6px; }
  .score .big { font-size: 96px; font-weight: 800; line-height: 1; color: var(--navy); letter-spacing: -2px; }
  .score .big span { font-size: 34px; color: var(--muted); letter-spacing: 0; font-weight: 700; }
  .score .detail { margin-top: 8px; color: var(--muted); font-size: 16px; }
  .review { margin: 22px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .review li { display: flex; gap: 10px; font-size: 15px; line-height: 1.4; padding: 10px 12px; border-radius: 10px; background: var(--pale); }
  .review li b { flex: 0 0 auto; }
  .review li.ko b { color: var(--coral); }
  .review li.ok b { color: var(--ok); }
  .list a {
    display: block; text-decoration: none; color: var(--navy); background: var(--pale);
    border-radius: 14px; padding: 16px; margin-bottom: 10px; font-size: 17px; font-weight: 600;
  }
  .list a small { display: block; font-weight: 400; color: var(--muted); font-size: 14px; margin-top: 4px; }
  .privacy { margin-top: 22px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header id="head">
    <p class="qname" id="qname">Formation CMA · S'initier à l'IA</p>
    <div class="progress" id="progress" hidden><div class="bar"><i id="barfill"></i></div><span id="count"></span></div>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

const $ = (s) => document.querySelector(s);
const app = $("#app");
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const letters = ["A", "B", "C", "D"];
const key = new URLSearchParams(location.search).get("q");
const quiz = QUIZZES[key];
let i = 0, score = 0, results = [];

function setProgress(show) {
  $("#progress").hidden = !show;
  if (show) {
    $("#count").textContent = (i + 1) + " / " + quiz.q.length;
    $("#barfill").style.width = ((i) / quiz.q.length * 100) + "%";
  }
}

function home() {
  document.title = "Quiz IA · Formation CMA";
  setProgress(false);
  const links = ["entree", "1", "2", "3", "4", "5"].map((k) =>
    '<a href="?q=' + k + '">' + esc(QUIZZES[k].title) + '<small>' + QUIZZES[k].q.length + ' questions</small></a>').join("");
  app.innerHTML = '<h1>Les quiz de la journée</h1><p class="muted">Scannez le QR code affiché par le formateur, ou choisissez votre quiz.</p><div class="list">' + links + "</div>";
}

function start() {
  document.title = quiz.title;
  $("#qname").textContent = quiz.title;
  setProgress(false);
  app.innerHTML = "<h1>" + esc(quiz.title) + "</h1><p>" + esc(quiz.intro) + "</p>" +
    '<p class="muted">Une question à la fois. Après chaque réponse, vous voyez la correction et une explication.</p>' +
    '<button class="btn" id="go">Commencer le quiz</button>' +
    '<p class="privacy">Aucun nom, aucun compte, aucune réponse n\'est enregistrée : votre note s\'affiche seulement sur votre téléphone.</p>';
  $("#go").onclick = () => { i = 0; score = 0; results = []; ask(); };
}

function ask() {
  const q = quiz.q[i];
  setProgress(true);
  app.innerHTML = '<h2 class="question">' + esc(q.t) + '</h2><div class="answers">' +
    q.o.map((o, k) => '<button class="answer" data-k="' + k + '"><span class="l">' + letters[k] + "</span><span>" + esc(o) + "</span></button>").join("") +
    '</div><div id="fb"></div>';
  app.querySelectorAll(".answer").forEach((b) => b.onclick = () => answer(+b.dataset.k));
  window.scrollTo(0, 0);
}

function answer(k) {
  const q = quiz.q[i], good = k === q.ans;
  if (good) score++;
  results.push(good);
  app.querySelectorAll(".answer").forEach((b) => {
    const n = +b.dataset.k;
    b.disabled = true;
    if (n === q.ans) b.classList.add("good");
    else if (n === k) b.classList.add("bad");
    else b.classList.add("dim");
  });
  const last = i === quiz.q.length - 1;
  $("#fb").innerHTML = '<div class="feedback ' + (good ? "ok" : "ko") + '"><strong>' +
    (good ? "Bonne réponse" : "La bonne réponse était " + letters[q.ans]) + "</strong><p>" + esc(q.e) + "</p></div>" +
    '<button class="btn" id="next">' + (last ? "Voir ma note" : "Question suivante") + "</button>";
  $("#barfill").style.width = ((i + 1) / quiz.q.length * 100) + "%";
  $("#next").onclick = () => { i++; last ? end() : ask(); };
  $("#next").focus({ preventScroll: true });
  $("#fb").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
}

function end() {
  setProgress(false);
  const n = quiz.q.length;
  const note = Math.round(score / n * 20) / 2;
  const noteTxt = String(note).replace(".", ",");
  let msg;
  if (quiz.entry) msg = "Ce score n'a aucune importance : c'est le point de départ. On reprend chaque question ensemble.";
  else if (note >= 8) msg = "Excellent ! Vous avez bien retenu l'essentiel de cette partie.";
  else if (note >= 5) msg = "Bonne base. La correction collective va éclaircir les derniers points.";
  else msg = "Pas d'inquiétude : c'est fait pour ça. On revoit les points clés ensemble.";
  const review = quiz.q.map((q, k) => '<li class="' + (results[k] ? "ok" : "ko") + '"><b>' + (results[k] ? "✓" : "✗") + " Q" + (k + 1) + "</b><span>" + esc(q.t) + "</span></li>").join("");
  app.innerHTML = '<div class="score"><div class="big">' + noteTxt + "<span> / 10</span></div>" +
    '<div class="detail">' + score + " bonne" + (score > 1 ? "s" : "") + " réponse" + (score > 1 ? "s" : "") + " sur " + n + "</div></div>" +
    "<p>" + msg + "</p><ul class=\"review\">" + review + "</ul>" +
    '<button class="btn secondary" id="again">Refaire le quiz</button>' +
    '<p class="privacy">Rien n\'a été enregistré. Si vous fermez cette page, votre note disparaît.</p>';
  $("#again").onclick = start;
  window.scrollTo(0, 0);
}

quiz ? start() : home();
</script>
</body>
</html>
