<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>QR codes des quiz · Formateur</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --navy: #12304F; --coral: #E94E3D; --teal: #A7D3DA; --pale: #EEF5F7; --muted: #5B6B7A; }
  body { margin: 0; font-family: "Avenir Next", "Segoe UI", system-ui, Arial, sans-serif; background: #fff; color: #1E293B; }
  .page { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
  h1 { color: var(--navy); margin: 0 0 6px; font-size: 28px; }
  p { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card { background: var(--pale); border-radius: 16px; padding: 20px; text-align: center; }
  .card h2 { font-size: 17px; color: var(--navy); margin: 0 0 14px; min-height: 44px; }
  .qr { background: #fff; padding: 14px; border-radius: 10px; display: inline-block; }
  .url { font-size: 12px; color: var(--muted); word-break: break-all; margin: 12px 0; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; margin: 4px; }
  .show { background: var(--coral); color: #fff; }
  .dl { background: var(--navy); color: #fff; }
  #big { position: fixed; inset: 0; background: var(--navy); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 24px; cursor: pointer; }
  #big h2 { color: #fff; font-size: 36px; margin: 0; text-align: center; padding: 0 20px; }
  #big .qr { padding: 24px; }
  #big small { color: var(--teal); font-size: 18px; }
  @media print { button, #big { display: none !important; } .card { break-inside: avoid; } }
</style>
</head>
<body>
<div class="page">
  <h1>QR codes des quiz</h1>
  <p>Page réservée au formateur. Les QR codes pointent vers l'adresse de ce site. Cliquez sur « Plein écran » pour les projeter, ou sur « Télécharger » pour les coller dans vos slides.</p>
  <div class="grid" id="grid"></div>
</div>
<div id="big"><h2 id="bigTitle"></h2><div class="qr" id="bigQr"></div><small>Scannez avec l'appareil photo de votre téléphone · cliquez pour fermer</small></div>
<script>
const QUIZ = [["entree", "Quiz d'entrée"], ["1", "Partie 1 · Comprendre l'IA"], ["2", "Partie 2 · L'IA au service de votre métier"],
  ["3", "Partie 3 · Quelle IA pour quel besoin ?"], ["4", "Partie 4 · Bien parler à l'IA"], ["5", "Partie 5 · Utiliser l'IA de façon responsable"]];
const base = location.origin + location.pathname.replace(/qr\.html$/, "");
const grid = document.getElementById("grid");
QUIZ.forEach(([k, t]) => {
  const url = base + "?q=" + k;
  const c = document.createElement("div");
  c.className = "card";
  c.innerHTML = "<h2></h2><div class='qr'></div><div class='url'></div><button class='show'>Plein écran</button><button class='dl'>Télécharger</button>";
  c.querySelector("h2").textContent = t;
  c.querySelector(".url").textContent = url;
  grid.appendChild(c);
  new QRCode(c.querySelector(".qr"), { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  c.querySelector(".show").onclick = () => {
    const b = document.getElementById("bigQr"); b.innerHTML = "";
    document.getElementById("bigTitle").textContent = t;
    const s = Math.min(innerWidth, innerHeight) * 0.6;
    new QRCode(b, { text: url, width: s, height: s, correctLevel: QRCode.CorrectLevel.M });
    document.getElementById("big").style.display = "flex";
  };
  c.querySelector(".dl").onclick = () => {
    const tmp = document.createElement("div");
    new QRCode(tmp, { text: url, width: 1000, height: 1000, correctLevel: QRCode.CorrectLevel.M });
    setTimeout(() => {
      const canvas = tmp.querySelector("canvas");
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "qr-quiz-" + k + ".png";
      a.click();
    }, 100);
  };
});
document.getElementById("big").onclick = function () { this.style.display = "none"; };
</script>
</body>
</html>
